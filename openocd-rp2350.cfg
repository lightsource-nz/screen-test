adapter speed 5000

# rp2350.cfg defaults to USE_CORE { cm0 cm1 } with SMP, exposing both Cortex-M33 cores as
# an hwthread RTOS group; launch.json's "rtos" setting must match this or the debugger and
# the server disagree about how many threads exist
#
# this board's firmware genuinely uses both cores -- TinyUSB and the log drain run on core 1
# (see LIGHT_PLATFORM_USB_ON_CORE1) -- so a single-core view would hide half of what is
# running, including whichever core a fault actually happened on
source [find target/rp2350.cfg]
