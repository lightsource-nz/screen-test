# Builds and tests screen-test on every push and pull request.
#
# The mechanics live in light_framework_mk3/.github/workflows/, so this file says only what is
# true of THIS project: which dependencies it needs beside it, and which board configurations are
# worth building. Everything else -- the sibling layout, the pinned ARM toolchain, picotool's apt
# packages, driving scripts/ rather than cmake -- is shared, because three copies of it drifting
# is the failure the scripts/ layer exists to prevent.
name: CI

on:
  push:
    branches: [development, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: host tests
    uses: lightsource-nz/light_framework_mk3/.github/workflows/project-test.yml@v1
    with:
      project: screen-test
      light_display: true
      font_crusher: true

  firmware:
    name: ${{ matrix.name }}
    strategy:
      # one board failing says nothing about the others, and knowing which of them broke in a
      # single run is worth more than finishing a few minutes sooner
      fail-fast: false
      matrix:
        include:
          - name: rp2040 (Pico + Pico-OLED 1.3)
            preset: conf-screentest-debug
            targets: screentest_po13 light_ui_demo_po13 screentest_sh1106_i2c screentest_sh1106_spi4
            tree: build
            pico_sdk: true
          - name: rp2350 (Waveshare Touch-LCD 1.69)
            preset: conf-screentest-waveshare-touch169-debug
            targets: screentest_ws_touch169 light_ui_demo_touch169 screentest_calib169
            tree: build-waveshare-touch169
            pico_sdk: true
          # bare CMSIS: no Pico SDK involved at all, which is why pico_sdk is false here
          - name: stm32h7 (WeAct MiniSTM32H7xx, bare CMSIS)
            preset: conf-screentest-mini-stm32h7-debug
            targets: screentest_mini_stm32h7
            tree: build-mini-stm32h7
            pico_sdk: false
    uses: lightsource-nz/light_framework_mk3/.github/workflows/project-build.yml@v1
    with:
      project: screen-test
      preset: ${{ matrix.preset }}
      targets: ${{ matrix.targets }}
      tree: ${{ matrix.tree }}
      light_display: true
      font_crusher: true
      pico_sdk: ${{ matrix.pico_sdk }}
